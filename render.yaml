services:
  - type: web
    name: taskify-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
